# Deploy from the repo root: fly deploy --config apps/api/fly.toml
# App is created once via: fly apps create called-my-shot-api --org called-my-shot
app = "called-my-shot-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Re-seeds prod on every deploy while we're still in development. Remove
  # the seed step (and ALLOW_PROD_SEED below) once real data matters.
  release_command = "sh -c 'pnpm exec drizzle-kit migrate && pnpm exec tsx src/db/seed.ts'"

[env]
  ALLOW_PROD_SEED = "true"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
