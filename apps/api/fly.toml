# Deploy from the repo root: fly deploy --config apps/api/fly.toml
# App is created once via: fly apps create called-my-shot-api --org called-my-shot
app = "called-my-shot-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs migrations, then upserts the stat catalog (db/catalog/stats.ts) -
  # both idempotent, so a deploy with no schema/catalog changes is a safe
  # no-op here. Keeps "add a stat to the source file" the only step needed
  # to get it into prod - no separate manual sync command to remember to run.
  release_command = "pnpm run release"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
