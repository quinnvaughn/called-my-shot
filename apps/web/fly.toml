# Deploy from the repo root: fly deploy --config apps/web/fly.toml
# App is created once via: fly apps create called-my-shot-web --org called-my-shot
app = "called-my-shot-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    # PostHog project API key - public by design, safe to commit. Get it
    # from PostHog project settings after creating a project.
    VITE_PUBLIC_POSTHOG_KEY = "phc_n5qRAw6zpz8iQy49tLcNdfYC3Y9eSA5rS7JAeFZUm5Vj"
    VITE_PUBLIC_POSTHOG_HOST = "https://us.i.posthog.com"

[env]
  # Reaches the api over Fly's private network (6PN) - never the public internet.
  API_INTERNAL_URL = "http://called-my-shot-api.internal:4000/"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
