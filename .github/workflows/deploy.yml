name: Deploy

# The only path to production. Tests run locally before pushing rather than on
# a runner. Fly's own GitHub auto-deploy must stay off, or it ships the push
# in parallel with this and skips the api-before-web ordering below.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# A newer push to main supersedes one still waiting to deploy, but never
# cancels a deploy already in flight - a half-finished release_command is worse
# than a slightly stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # api before web: web's image build checks its queries against the live
  # api's schema (apps/web/scripts/check-schema-compat.ts), so the api has to
  # be serving this commit's schema first.
  deploy-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --config apps/api/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --config apps/web/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
