# Postgres for the API's integration tests only - NOT the dev database, which
# lives on 5433 (see apps/api/.env.example). Deliberately a separate port and
# a separate database name: the integration suite truncates every table
# between tests, so pointing it at the dev database would wipe local data.
#
#   docker compose up -d postgres-test
#   pnpm test
#
# tmpfs, not a named volume - this data is disposable by definition, and
# keeping it in memory makes the truncate-between-tests cycle noticeably
# faster than a disk-backed volume.
services:
  postgres-test:
    image: postgres:18-alpine
    container_name: called-my-shot-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: called_my_shot_test
    ports:
      - "5435:5432"
    # Postgres 18 images want a single mount at /var/lib/postgresql and place
    # the cluster in a subdirectory of it - mounting /var/lib/postgresql/data
    # directly makes the entrypoint think it found an un-upgraded PG17
    # cluster and refuse to boot.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d called_my_shot_test"]
      interval: 2s
      timeout: 3s
      retries: 30
